[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appname"
dynamic = ["version"]
description = "Én setning om hva dette gjør"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Victor Rørslett Uhnger" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "ty>=0.0.1a1",
]

[project.scripts]
appname = "appname.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/appname/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/appname"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ty.src]
include = ["src/appname"]
